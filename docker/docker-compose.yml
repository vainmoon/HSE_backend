name: avito-moderation

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    env_file:
      - .env
    command: >
      -url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      -locations=filesystem:/flyway/migrations
      migrate
    volumes:
      - ../db/migrations:/flyway/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    env_file:
      - .env
    volumes:
      - ../app:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - flyway

  tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    env_file:
      - .env
    volumes:
      - ..:/project
    working_dir: /project
    command: pytest -v
    environment:
      - PYTHONPATH=/project:/project/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
name: avito-moderation

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    env_file:
      - .env
    command: >
      -url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      -locations=filesystem:/flyway/migrations
      migrate
    volumes:
      - ../db/migrations:/flyway/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    env_file:
      - .env
    volumes:
      - ../app:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - flyway

  tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    env_file:
      - .env
    volumes:
      - ..:/project
    working_dir: /project
    command: pytest -v
    environment:
      - PYTHONPATH=/project:/project/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"

  console:
    image: redpandadata/console:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/root/redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf

  redisinsight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
  worker:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    command: python -m workers.moderation_worker
    env_file:
      - .env
    volumes:
      - ../app:/app
    restart: unless-stopped
    depends_on:
      - redpanda
      - flyway
      - redis

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      -  api

  grafana:
    image: grafana/grafana:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redis_data:
  redisinsight_data: